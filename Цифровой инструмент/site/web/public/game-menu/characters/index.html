<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Выбор персонажа — ОЧАКОВО</title>
<style>
@font-face{font-family:Proxima;src:url('../../brand/assets/fonts/ProximaNova-Regular.woff2');font-weight:400;font-display:block}
@font-face{font-family:Proxima;src:url('../../brand/assets/fonts/ProximaNova-Bold.woff2');font-weight:700;font-display:block}
*{box-sizing:border-box}html,body{margin:0;color:#151515;background:#f6f5f2;font-family:Proxima,Arial,sans-serif}body{width:1600px}button{font:inherit;cursor:pointer;border-radius:0}button:focus-visible{outline:3px solid #032ab2;outline-offset:4px}h1,h2,p,dl,dd{margin:0}
.screen{position:relative;isolation:isolate;width:1600px;min-height:1000px;background:linear-gradient(125deg,#fff 12%,#faf8f3 68%,#ece7dc);overflow:hidden}.screen:before{content:'';position:absolute;inset:0;background:linear-gradient(116deg,transparent 69%,#e6ddcc40 69.1%,#e6ddcc40 73%,transparent 73.1%);z-index:-1;pointer-events:none}
.back{position:absolute;top:42px;left:64px;display:flex;align-items:center;gap:12px;border:0;background:none;font-weight:700;font-size:20px;padding:0}.back span{font-size:32px;line-height:1}.logo{position:absolute;top:44px;right:156px;width:160px;height:38px;object-fit:contain}.sound{position:absolute;top:36px;right:64px;width:54px;height:54px;border:1px solid #dcdcd7;background:#fff;color:#62625f;display:grid;place-items:center;padding:14px}.sound svg{width:100%;height:100%}
.heading{position:absolute;top:119px;left:64px}.heading h1{font-size:56px;line-height:1.04;letter-spacing:-1px}.heading p{margin-top:16px;font-size:23px;color:#62625f}
.detail-list{position:absolute;top:266px;left:64px;width:540px;display:grid;gap:12px}.list-role{position:relative;min-height:100px;padding:16px 24px 16px 100px;display:flex;align-items:center;gap:8px;border:1px solid #dcdcd7;background:#ffffffba;text-align:left;color:#151515}.list-role img{position:absolute;left:12px;bottom:0;width:62px;height:94px;object-fit:contain;object-position:center top}.list-role h2{font-size:26px;line-height:1.1;max-width:370px}.list-role[aria-pressed=true]{border:2px solid #d50032;background:#fff}.list-role[aria-pressed=true] h2{color:#d50032}.check{margin-left:auto;background:#d50032;color:white;width:24px;height:24px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.hero-block{position:absolute;left:700px;top:203px;width:836px;height:650px;background:radial-gradient(ellipse at 54% 75%,#e8dfceaa,transparent 62%)}.hero-block:before{content:'';position:absolute;width:300px;height:300px;background:#d5003208;left:130px;top:160px;transform:rotate(-6deg)}.character-enter{position:absolute;inset:0 0 24px;transform-origin:50% 95%;}.character-enter img{width:100%;height:100%;object-fit:contain}
.hero-copy{position:absolute;left:64px;top:746px;width:620px}.hero-copy h2{font-size:34px;line-height:1.05;letter-spacing:-.5px}.job-description{margin-top:16px;font-size:23px;line-height:1.35;color:#62625f}
.bottom{position:absolute;bottom:48px;left:64px;right:64px;display:flex;align-items:center;justify-content:flex-end}.bottom p{font-size:17px;color:#62625f;line-height:1.3;max-width:420px}.start{border:0;background:#d50032;color:white;height:82px;min-width:328px;padding:0 54px;font-size:28px;line-height:1;font-weight:700;white-space:nowrap}.start:hover{box-shadow:inset 0 0 0 3px #fff}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:700px){html,body{width:100%}.screen{width:100%;min-height:100vh;padding:96px 20px 0;overflow:visible}.back{top:30px;left:20px;font-size:14px;gap:7px}.back span{font-size:25px}.logo{top:31px;right:82px;width:110px;height:27px}.sound{top:22px;right:20px;width:44px;height:44px;padding:10px}.heading{position:static}.heading h1{font-size:29px;max-width:340px;letter-spacing:-.5px}.heading p{font-size:16px;margin-top:10px}.detail-list{position:static;width:auto;margin-top:25px;gap:8px}.list-role{min-height:65px;padding:12px 15px 12px 65px}.list-role img{left:9px;width:45px;height:63px}.list-role h2{font-size:19px;max-width:235px}.hero-block{position:relative;left:auto;top:auto;width:100%;height:360px;margin:20px 0 26px}.hero-block:before{width:200px;height:200px;left:calc(50% - 100px);top:75px}.character-enter{inset:0 0 36px}.hero-copy{position:static;width:100%}.hero-copy h2{font-size:30px}.job-description{font-size:19px;margin-top:14px}.bottom{position:static;bottom:auto;left:auto;right:auto;margin:30px -20px 0;background:#fff;padding:16px 20px;border-top:1px solid #dcdcd7;z-index:2;justify-content:flex-end}.bottom p{display:none}.start{height:52px;font-size:20px;min-width:0;width:100%;padding:0 23px}}

html{scrollbar-gutter:stable}body{zoom:var(--selection-scale,1)}
.bottom .launch-status:not(:empty){display:block}
.launch-status:empty{display:none}
.launch-status{color:#62625f;font-size:18px;line-height:1.3;max-width:520px;margin-right:24px}
.list-role:disabled,.back:disabled{cursor:wait;opacity:.7}.start:disabled{cursor:wait}
.sound[aria-pressed=true] .mute-mark,.sound[aria-pressed=false] .wave-mark{display:none}
.sound[aria-pressed=true]{color:#d50032;border-color:#d50032}
@media(max-width:700px){html{scrollbar-gutter:auto}body{zoom:1}.launch-status{font-size:14px;margin:0 0 12px}.bottom{display:block}.start{min-height:52px}}
.character-action{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none}
</style>
</head>
<body><main id="screen" class="screen"></main>
<script type="module">
import {mountCharacterAction} from "./animation.js";
let characterAction;
const roles=[
{id:'chemist',title:'Химик-лаборант',description:'Проверяет качество напитков в лаборатории: берёт пробы, проводит анализы и сравнивает результаты с нормами. Внимательность специалиста помогает выпускать продукцию нужного качества.'},
{id:'bottling',title:'Оператор линии розлива',description:'Следит за работой линии розлива: от наполнения упаковки до нанесения этикетки. Контролирует машины и готовую продукцию, замечает отклонения и помогает поддерживать ритм линии.'},
{id:'machinery',title:'Машинист оборудования',description:'Контролирует технологические установки: проверяет показания на панели управления и поддерживает нужный режим работы. Важно вовремя заметить отклонение и действовать по инструкции.'},
{id:'brewer',title:'Квасовар',description:'Следит за тем, как сырьё превращается в квас: контролирует брожение, проверяет качество и ведёт производственные записи. Тонкости осваивает на практике, перенимая опыт старших коллег.'}
];
const params=new URLSearchParams(location.search);let selected=roles.some(r=>r.id===params.get('role'))?params.get('role'):'chemist';let inactive=false;let muted=true;let loading=false;
const notify=(type,role=selected)=>{if(parent!==window)parent.postMessage({channel:'ochakovo-selection',type,role},location.origin)};
const fit=()=>document.documentElement.style.setProperty('--selection-scale',innerWidth>700?String(innerWidth/1600):'1');fit();addEventListener('resize',fit);
const chrome=`<button class="back" type="button"><span aria-hidden="true">←</span>Назад</button><img class="logo" src="../../brand/assets/ochakovo-logo.svg" alt="ОЧАКОВО"><button class="sound" type="button" aria-label="Звук"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12h5l7-6v20l-7-6H5z" fill="currentColor"/><path class="wave-mark" d="M21 11q5 5 0 10M25 7q9 9 0 18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><path class="mute-mark" d="m22 12 7 8m0-8-7 8" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg></button><header class="heading"><h1>Кем ты будешь сегодня?</h1><p>Выбери персонажа и познакомься с профессией.</p></header>`;
function render(focus=false){characterAction?.destroy();const active=roles.find(r=>r.id===selected);const screen=document.querySelector('#screen');screen.className='screen'+(inactive||document.hidden?' paused':'');
screen.innerHTML=chrome+`<nav class="detail-list" aria-label="Выбор профессии">${roles.map(r=>`<button class="list-role" data-role="${r.id}" aria-pressed="${r.id===selected}"><img src="art/${r.id}.webp" alt=""><h2>${r.title}</h2>${r.id===selected?'<span class="check" aria-hidden="true">✓</span>':''}</button>`).join('')}</nav><div class="hero-block"><div class="character-enter" data-character="${active.id}"><img src="art/${active.id}.webp" alt="Игровой персонаж: ${active.title}"></div></div><section class="hero-copy" aria-label="О работе"><h2>${active.title}</h2><p class="job-description">${active.description}</p></section><footer class="bottom"><p class="launch-status" role="status"></p><button class="start" type="button">Начать смену</button></footer><p class="sr-only" role="status">Выбрана профессия: ${active.title}</p>`;
screen.querySelectorAll('[data-role]').forEach(button=>button.onclick=()=>{selected=button.dataset.role;render(true);notify('select')});
screen.querySelector('.back').onclick=()=>notify('back');
screen.querySelector('.start').onclick=()=>notify('start');
const sound=screen.querySelector('.sound');sound.setAttribute('aria-pressed',String(!muted));sound.setAttribute('aria-label',muted?'Включить звук ветра':'Выключить звук ветра');sound.onclick=()=>notify('sound');
characterAction=mountCharacterAction(screen.querySelector('.character-enter'),selected,()=>!inactive);
if(focus)screen.querySelector(`[data-role="${selected}"]`).focus({preventScroll:true});}
render();
document.addEventListener('visibilitychange',()=>{document.querySelector('#screen').classList.toggle('paused',inactive||document.hidden);characterAction?.sync()});

window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==parent||event.data?.channel!=='ochakovo-menu')return;
 const data=event.data;
 if(data.type==='select'&&roles.some(role=>role.id===data.role)){selected=data.role;render()}
 if(data.type==='sound'){muted=data.muted;const button=document.querySelector('.sound');button.setAttribute('aria-pressed',String(!muted));button.setAttribute('aria-label',muted?'Включить звук ветра':'Выключить звук ветра')}
 if(data.type==='active'){inactive=!data.value;document.querySelector('#screen').classList.toggle('paused',inactive||document.hidden);characterAction?.sync()}
 if(data.type==='loading'){
  loading=data.value;
  document.querySelectorAll('.list-role,.back,.start').forEach(button=>button.disabled=loading);
  document.querySelector('.start').textContent=loading?(typeof data.progress==='number'?'Загружаем… '+Math.round(data.progress*100)+'%':'Загружаем…'):'Начать смену';
  document.querySelector('.launch-status').textContent=data.error||'';
 }
});
notify('ready');
</script></body></html>
