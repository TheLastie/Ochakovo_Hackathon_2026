events {}
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_types application/javascript application/wasm application/octet-stream application/json text/css;
 # The outer HTTPS proxy must overwrite X-Forwarded-Proto. Port 8080 is local only.
 map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
 }
 server {
  listen 80;
  client_max_body_size 16k;
  location /static/ { alias /static/; add_header X-Content-Type-Options nosniff; }
  location / { proxy_pass http://app:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
 }
}
